<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Strings: Dating Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Heart Strings</h1>
            <button id="settingsButton" aria-label="Settings">⚙️</button>
        </header>

        <div id="loadingScreen" class="screen">
            <div class="loading-content">
                <h2>Heart Strings</h2>
                <p>Your dating adventure is loading...</p>
                <div class="loading-spinner"></div>
            </div>
        </div>

        <div id="mainMenuScreen" class="screen hidden">
            <div class="main-menu-content">
                <h2>Welcome to Heart Strings</h2>
                <button id="startButton" class="menu-button">Start Dating</button>
                <button id="continueButton" class="menu-button">Continue</button>
                <button id="resetButton" class="menu-button">Reset Progress</button>
            </div>
        </div>

        <div id="characterSelectScreen" class="screen hidden">
            <h2>Choose Who to Date</h2>
            <div id="charactersContainer" class="characters-container">
                <!-- Characters will be populated here -->
            </div>
            <button id="backToMainButton" class="back-button">Back</button>
        </div>

        <div id="locationSelectScreen" class="screen hidden">
            <h2>Choose a Location</h2>
            <div id="characterPreview" class="character-preview">
                <div id="selectedCharacterImage" class="selected-character-image">
                    <!-- Selected character image will be shown here -->
                </div>
                <div id="selectedCharacterInfo" class="selected-character-info">
                    <h3 id="selectedCharacterName"></h3>
                    <p id="relationshipStatus"></p>
                </div>
            </div>
            <div id="locationsContainer" class="locations-container">
                <!-- Locations will be populated here -->
            </div>
            <button id="backToCharactersButton" class="back-button">Back</button>
        </div>

        <div id="dateScreen" class="screen hidden">
            <div class="date-container">
                <div id="dateLocationImage" class="date-location-image">
                    <!-- Location image will be shown here -->
                </div>
                <div id="dateCharacterImage" class="date-character-image">
                    <!-- Character image will be shown here -->
                </div>
                <div id="dialogueContainer" class="dialogue-container">
                    <div id="characterName" class="character-name"></div>
                    <div id="dialogueText" class="dialogue-text"></div>
                    <div id="dateTimerDisplay" class="date-timer-display">Time remaining: <span id="timeRemaining"></span></div>
                </div>
                <div id="responseContainer" class="response-container">
                    <div id="responseOptions" class="response-options">
                        <!-- Response options will be populated here -->
                    </div>
                    <div id="customResponseContainer" class="custom-response-container">
                        <input type="text" id="customResponseInput" placeholder="Type your own response...">
                        <button id="sendCustomResponse">Send</button>
                    </div>
                </div>
                <button id="backToLocationsButton" class="back-button">End Date</button>
            </div>
        </div>

        <div id="dateEndScreen" class="screen hidden">
            <div class="date-end-content">
                <h2>Date Ended</h2>
                <p id="dateEndSummary"></p>
                <p id="relationshipChange"></p>
                <div id="farewellOptions">
                    <!-- Farewell options will be populated here -->
                </div>
                <button id="returnToLocationSelect" class="menu-button">Continue</button>
            </div>
        </div>

        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <div class="setting-group">
                    <label for="ttsEnabled">Text-to-Speech:</label>
                    <label class="switch">
                        <input type="checkbox" id="ttsEnabled" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-group">
                    <label for="speechRate">Speech Rate:</label>
                    <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1">
                    <span id="speechRateValue">1.0</span>
                </div>
                <div class="setting-group">
                    <label for="speechVolume">Speech Volume:</label>
                    <input type="range" id="speechVolume" min="0" max="1" step="0.1" value="1">
                    <span id="speechVolumeValue">1.0</span>
                </div>
                <div class="setting-group">
                    <label for="textSpeed">Text Display Speed:</label>
                    <input type="range" id="textSpeed" min="1" max="100" step="1" value="50">
                    <span id="textSpeedValue">50</span>
                </div>
                <button id="closeSettings">Close</button>
            </div>
        </div>

        <div id="confirmationModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="confirmationTitle">Confirmation</h2>
                <p id="confirmationMessage"></p>
                <div class="button-group">
                    <button id="confirmYes">Yes</button>
                    <button id="confirmNo">No</button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "marked": "https://cdn.jsdelivr.net/npm/marked@4.0.0/lib/marked.esm.js"
        }
    }
    </script>
    <script src="scripts/data.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/tts.js"></script>
    <script src="scripts/imageGenerator.js"></script>
    <script src="scripts/dialogueManager.js"></script>
    <script src="scripts/memoryManager.js"></script>
    <script src="scripts/relationshipManager.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
